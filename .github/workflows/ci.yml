name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # эталонное окружение проекта — Python 3.14; в матрице стоят версии,
        # гарантированно доступные в actions/setup-python
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка окружения
        run: python scripts/check_env.py

      - name: Компиляция исходников
        run: python -m compileall -q app scripts tests

      # Обучение в CI выполняется: архивные прогнозы погоды закоммичены
      # в data/cache/weather, сеть не нужна, на чистом клоне прогон занимает
      # около 15 секунд. Благодаря этому в CI проходит и тест выпуска агента,
      # который без models/*.joblib помечается skipif (сами модели не
      # коммитятся: формат pickle привязан к версии scikit-learn).
      - name: Обучение моделей
        run: python -m app.cli train

      - name: Автотесты
        run: python -m pytest -q tests
